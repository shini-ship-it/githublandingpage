name: Career Copilot Backend CI

on:
  push:
    branches:
      - main
      - career-copilot-fullstack
    paths:
      - "career-copilot/backend/**"
      - ".github/workflows/career-copilot-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "career-copilot/backend/**"
      - ".github/workflows/career-copilot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-copilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: career-copilot/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: career-copilot/backend/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-copilot-test-reports
          path: career-copilot/backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
