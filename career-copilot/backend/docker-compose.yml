services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: careercopilot
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_dev_password
    ports:
      - "5432:5432"
    volumes:
      - career_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d careercopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/careercopilot
      DB_USERNAME: career
      DB_PASSWORD: career_dev_password
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  career_data:
